<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <title>Ahmad Alhariri — Software Engineer & Flutter Developer</title>
    <meta
      name="description"
      content="Ahmad Alhariri is a software engineer specializing in Flutter, mobile apps and web development. Explore projects, experience and client reviews, and get in touch."
    />
    <link rel="canonical" href="https://ahmadalhariri.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ahmadalhariri.dev/" />
    <meta
      property="og:title"
      content="Ahmad Alhariri — Software Engineer & Flutter Developer"
    />
    <meta
      property="og:description"
      content="Explore Ahmad Alhariri's mobile apps, web projects, experience and client reviews."
    />
    <meta property="og:image" content="https://ahmadalhariri.dev/avatar.jpg" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Fetch the saved theme while the app downloads, so the first render uses it
      window.savedLook = fetch(
        "%VITE_SUPABASE_URL%/rest/v1/portfolio_personal_info?select=primary_color,color_rotation_enabled,corner_style&is_primary=eq.true&limit=1",
        { headers: { apikey: "%VITE_SUPABASE_PUBLISHABLE_KEY%" } },
      )
        .then((response) => (response.ok ? response.json() : []))
        .then((rows) => rows[0])
        .catch(() => undefined);
    </script>
    <link
      rel="preload"
      href="/fonts/3100e775e861.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      html {
        background: #09090b;
        color: #f2f2f2;
      }
      body {
        margin: 0;
      }
      .startup {
        min-height: 100dvh;
        display: grid;
        place-content: center;
        text-align: center;
        font-family: system-ui, sans-serif;
        padding: 0 1.5rem;
      }

      /* First paint, before the app bundle arrives. Inline and JS-free so it shows
         immediately; it removes itself the moment React fills #root — no script,
         no timer. position:fixed keeps it out of flow, so it cannot shift layout. */
      .splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 1.25rem;
        background: #09090b;
        font-family: system-ui, sans-serif;
      }
      #root:not(:empty) ~ .splash {
        display: none;
      }
      .splash-mark {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.03em;
      }
      .splash-mark span {
        color: #a78bfa;
      }
      .splash-track {
        position: relative;
        overflow: hidden;
        width: 14rem;
        max-width: 60vw;
        height: 1px;
        background: #27272a;
      }
      .splash-bar {
        position: absolute;
        inset: 0 auto;
        width: 33%;
        background: #a78bfa;
        box-shadow: 0 0 12px 2px rgba(167, 139, 250, 0.55);
        animation: splash-slide 1.6s ease-in-out infinite;
      }
      .splash-label {
        font-size: 0.625rem;
        text-transform: uppercase;
        letter-spacing: 0.45em;
        padding-inline-start: 0.45em;
        color: #71717a;
      }
      @keyframes splash-slide {
        from {
          transform: translateX(-250%);
        }
        to {
          transform: translateX(350%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-bar {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="splash" aria-hidden="true">
      <span class="splash-mark" dir="ltr">AHMAD<span>.DEV</span></span>
      <span class="splash-track"><span class="splash-bar"></span></span>
      <span class="splash-label" dir="ltr">Loading</span>
    </div>
    <noscript
      ><!-- without JS #root stays empty forever, so the splash would never leave -->
      <style>
        .splash {
          display: none;
        }
      </style>
      <main class="startup">
        <h1>Ahmad Alhariri</h1>
        <p>Software Engineer · Flutter & Web Developer</p>
        <p>
          Enable JavaScript to explore my projects, experience and client
          reviews.
        </p>
        <a href="mailto:mr.ahmed.alhariri@gmail.com">Contact Ahmad</a>
      </main></noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
