name: Deploy Portfolio to Vercel

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build portfolio
        run: pnpm --filter @workspace/portfolio exec vite build --config vite.config.deploy.ts

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-dist
          path: artifacts/portfolio/dist
          retention-days: 7
